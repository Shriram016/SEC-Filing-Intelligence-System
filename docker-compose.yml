# Local services for V3. Start: `docker compose up -d qdrant`. Stop: `docker compose down`.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0 # pinned; client is qdrant-client 1.20.x
    ports:
      - "6333:6333" # REST + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      # Named volume: a Windows folder bind mount is too slow for database writes.
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
