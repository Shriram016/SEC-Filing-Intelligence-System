name: CI

on:
  push:
  pull_request:

# Free checks only. No API keys: nothing here calls an LLM or a paid service.
# Real-AI runs (quality gate, evals) are manual and show their cost first (docs/v3/testing-ci.md).
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest

      - name: Dependency vulnerabilities
        run: uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/req.txt && uv run pip-audit -r /tmp/req.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
