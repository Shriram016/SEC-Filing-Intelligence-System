name: CI

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # CPU-only torch first: the default Linux wheel bundles CUDA and is ~2 GB.
      # The offline tests need no GPU. pip keeps this install when it resolves the rest.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No secrets needed: offline tests make no API calls and need no data/ or chroma_db/.
      - name: Run offline tests
        run: pytest tests/offline -v
